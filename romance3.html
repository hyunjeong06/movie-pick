<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로맨스 영화 추천</title>
  <link rel="stylesheet" href="3style.css">
</head>

<body>

<!-- 로그인/회원가입 토글 -->
<input type="checkbox" id="login-toggle">
<input type="checkbox" id="join-toggle">

<header>
  <h1> 로맨스 영화 추천</h1>
</header>

<nav>
  <a href="3index.html">전체</a>
  <a href="horror3.html">공포</a>
  <a href="romance3.html">로맨스</a>

  <!-- 추가 -->
  <label for="login-toggle">로그인</label>
  <label for="join-toggle">회원가입</label>
</nav>

<!-- 로그인 -->
<div class="modal-overlay login-modal">

  <div class="modal-content">

    <label for="login-toggle" class="close-btn">&times;</label>

    <h2>로그인</h2>

    <input type="text" id="loginId" placeholder="아이디">

    <input type="password" id="loginPw" placeholder="비밀번호">

    <button class="submit-btn" onclick="loginCheck()">
      로그인
    </button>

    <p id="loginMsg"></p>

  </div>

</div>

<!-- 회원가입 -->
<div class="modal-overlay join-modal">

  <div class="modal-content">

    <label for="join-toggle" class="close-btn">&times;</label>

    <h2>회원가입</h2>

    <input type="text" id="joinId" placeholder="아이디">

    <input type="password" id="joinPw" placeholder="비밀번호">

    <input type="email" id="joinEmail" placeholder="이메일">

    <button class="submit-btn" onclick="joinCheck()">
      가입하기
    </button>

    <p id="joinMsg"></p>

  </div>

</div>

<div class="container">

  <div class="movie">

    <img src="https://tse1.mm.bing.net/th/id/OIP.JsDF295iim5nLxUM24zyBQHaKm?pid=Api&h=220&P=0">

    <div class="movie-content">

      <h3>오늘 밤 세계에서 이 사랑이 사라진다 해도</h3>

      <p>
        한 번 자고 일어나면 기억이 리셋되는 선행성 기억상실증[2]을 앓는 소녀 히노 마오리와 무미건조한 인생을 살고 있는 평범한 고등학생 카미야 토오루의 풋풋하고 애틋한 사랑 이야기.
      </p>

      <button class="like-btn" onclick="likeMovie(this)">
        좋아요
      </button>

    </div>

  </div>

</div>

<script src="3script.js"></script>
</body>
</html>
