```html
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>회원가입</title>

  <link rel="stylesheet" href="join.css">
</head>

<body>

  <div class="join-container">

    <div class="logo">
      🎬
    </div>

    <h1>회원가입</h1>

    <p class="sub-text">
      다양한 영화를 추천받아보세요
    </p>

    <div class="input-box">
      <label>이름</label>
      <input type="text" id="joinName" placeholder="이름 입력">
    </div>

    <div class="input-box">
      <label>아이디</label>
      <input type="text" id="joinId" placeholder="아이디 입력">
    </div>

    <div class="input-box">
      <label>비밀번호</label>
      <input type="password" id="joinPw" placeholder="비밀번호 입력">
    </div>

    <div class="input-box">
      <label>비밀번호 확인</label>
      <input type="password" id="joinPw2" placeholder="비밀번호 다시 입력">
    </div>

    <div class="input-box">
      <label>이메일</label>
      <input type="email" id="joinEmail" placeholder="이메일 입력">
    </div>

    <button class="join-btn" onclick="joinCheck()">
      회원가입
    </button>

    <p id="joinMsg"></p>

  </div>

  <script src="join.js"></script>

</body>

</html>
```
