```html
<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>로그인</title>

  <link rel="stylesheet" href="login.css">

</head>

<body>

  <div class="login-box">

    <h1>LOGIN</h1>

    <p class="sub-text">
      영화 추천 사이트에 오신 것을 환영합니다
    </p>

    <div class="input-box">

      <label>아이디</label>

      <input type="text"
             id="loginId"
             placeholder="아이디 입력">

    </div>

    <div class="input-box">

      <label>비밀번호</label>

      <input type="password"
             id="loginPw"
             placeholder="비밀번호 입력">

    </div>

    <div class="option-box">

      <label>
        <input type="checkbox">
        로그인 유지
      </label>

      <span>비밀번호 찾기</span>

    </div>

    <button class="login-btn"
            onclick="loginCheck()">

      로그인

    </button>

    <p id="loginMsg"></p>

  </div>

  <script src="login.js"></script>

</body>

</html>
```
